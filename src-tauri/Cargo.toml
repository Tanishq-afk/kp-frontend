[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Raw printer access (bypasses the browser print engine) — Windows only,
# see src/printing.rs.
[target.'cfg(windows)'.dependencies]
# windows-sys (not `windows`): raw, unwrapped FFI bindings that mirror the
# Win32 C headers almost verbatim (plain fn signatures returning BOOL/u32,
# plain *const/*mut pointers, no Result-wrapping, no generic Param<T>
# trickery). Picked specifically to avoid version-sensitive ergonomic-wrapper
# behavior we can't test-compile locally on Windows.
windows-sys = { version = "0.61", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }
